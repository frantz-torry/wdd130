<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Company</title>
    <meta name="description" content="This is a site to contact the water rafting adventures company.">
    <meta name="author" content="Frantz-Torry Thermidor ">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
    <img src="images/logo.jpg" alt="White water rafting logo">
        <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>   
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>

             <p>123 Main River Street<br>
                 Kolob, California<br>
                 +1 999 999 9999<br>
                info@whitewater.com</p>
        </section>

        <section class="contact-content">

            <div class="map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d6511963.524501017!2d-124.59548002461845!3d37.160552907460975!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1s123%20Main%20River%20Street%20Kolob%2C%20California!5e0!3m2!1sfr!2sht!4v1791631440070!5m2!1sfr!2sht" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

             <div class="contact-form">
                 <form>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">

                     <p>Purpose</p>

                    <label for="general">
                    <input type="radio" id="general" name="purpose" value="general">
                    General Inquiry
                    </label>

                    <label for="reservation">
                    <input type="radio" id ="reservation" name="purpose" value="reservation">
                    Reservation Question
                    </label>

                    <label for="suggestion">
                    <input type="radio"  id="suggestion" name="purpose" value="suggestion">
                    Website Suggestion
                    </label>

                    <label for="message">Message</label>
                    <textarea id="message" name="message"></textarea>

                    <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please Subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>

            </div>
        
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/dessalines.jpg" alt="Jean Dessalines, General Manager">
                    <figcaption>Jean J. Dessalines - General Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/kobe.jpg" alt="Kobe Bryant, Reservations Manager">
                    <figcaption>Kobe Bryant - Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/jordan.jpg" alt="Michael Jordan, River Guide">
                    <figcaption>Michael Jordan - River Guide</figcaption>
                </figure>

            </div>

        </section>

           
    </main>
    <footer>
        <p>©️ | 2026 | White Rafting Company | Frantz-Torry Thermidor</p>
        <nav class="socialmedia">
             <a href="https://www.facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
             </a>

            <a href="https://www.instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
             </a>

            <a href="https://www.twitter.com">
                 <img src="images/twitter.png" alt="Twitter">
             </a>
        </nav>
    </footer>
</body>
</html>
